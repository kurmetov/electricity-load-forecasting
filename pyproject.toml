[project]
name = "electricity-load-forecasting"
version = "0.1.0"
description = "Electricity load forecasting and load profile clustering on UCI ElectricityLoadDiagrams20112014"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "streamlit>=1.35",
    "holidays>=0.50",
    "runboard",
]

[dependency-groups]
docs = ["python-docx>=1.1", "python-pptx>=0.6.23"]

[tool.uv]
package = false

[tool.uv.sources]
runboard = { git = "https://github.com/kurmetov/runboard" }
